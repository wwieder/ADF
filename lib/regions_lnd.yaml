# Define regions with lists for boundaries of 
#   - lat (-90 to 90)
#   - lon (-180 to 180)
#   - region_category for website plotting

Global:
  lat_bounds: [-90, 90]
  lon_bounds: [-180, 180]
  region_category: Global
N Hemisphere Land:
  lat_bounds: [0, 90]
  lon_bounds: [-180, 180]
  region_category: Global
S Hemisphere Land:
  lat_bounds: [-90, 0]
  lon_bounds: [-180, 180]
  region_category: Global
